on:
  push:
    branches:
      - main
  workflow_dispatch:


permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: "release-please-config.json"
          manifest-file: ".release-please-manifest.json"
